<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 코드 인쇄</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--brand:#1f3a5f;--line:#d9dfe7;--muted:#6b7686}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#eef1f5;color:#18212d;font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;word-break:keep-all}
.panel{max-width:900px;margin:24px auto;padding:20px;background:#fff;border-radius:16px;border:1px solid var(--line)}
.panel h1{margin:0 0 6px;font-size:1.3rem}
.panel p{margin:4px 0;color:var(--muted);font-size:.92rem}
.panel label{display:block;font-weight:700;margin:14px 0 6px}
.panel input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:1rem}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.opts button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:.95rem}
.opts button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.opts button[aria-pressed="true"]{outline:3px solid #9cc3ec}
.sheet{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:14mm;display:flex;flex-direction:column}
.main{align-items:center;justify-content:center;text-align:center;gap:6mm}
.main .school{font-size:16pt;color:var(--muted);font-weight:600}
.main h2{font-size:30pt;margin:0;line-height:1.25}
.main .qr svg{width:120mm;height:120mm}
.main .hint{font-size:15pt;color:#333}
.main .url{font-size:10pt;color:var(--muted);word-break:break-all}
.grid4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6mm;flex:1}
.cell{border:1.5px dashed #b8c2cf;border-radius:6mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6mm;gap:2mm}
.cell .k{font-size:34pt;font-weight:800;color:var(--brand);line-height:1}
.cell .s{font-size:14pt;font-weight:700}
.cell .t{font-size:10.5pt;color:#444;line-height:1.4;max-height:3em;overflow:hidden}
.cell .qr svg{width:52mm;height:52mm}
.cell .h{font-size:9.5pt;color:var(--muted)}
.door{align-items:center;justify-content:center;text-align:center;gap:7mm}
.door .k{font-size:80pt;font-weight:800;color:var(--brand);line-height:1}
.door .s{font-size:26pt;font-weight:800}
.door .t{font-size:16pt;color:#333;max-width:160mm;line-height:1.45}
.door .who{font-size:15pt;color:var(--muted)}
.door .qr svg{width:95mm;height:95mm}
.door .h{font-size:14pt}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .panel{display:none}
  .sheet{margin:0;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<div class="panel">
  <h1>공개수업 지도안 QR 코드</h1>
  <p>아래 주소가 실제 배포된 지도안 주소인지 확인한 뒤, 원하는 형식을 골라 인쇄하세요. (인쇄 설정: A4, 여백 없음, 배경 그래픽 켜기)</p>
  <label for="base">지도안 웹페이지 주소</label>
  <input id="base">
  <div class="opts" id="modes">
    <button data-m="main" aria-pressed="true">전체 안내용 (1장)</button>
    <button data-m="cards">학급별 카드 (4개씩, 5장)</button>
    <button data-m="door">교실 문 부착용 (학급당 1장)</button>
    <button class="primary" id="printBtn">인쇄하기</button>
  </div>
</div>
<div id="out"></div>

        <div class="t">${esc(l.topic || "")}</div><div class="qr">${qr(link(l.id))}</div><div class="h">QR로 지도안 보기 · 피드백 남기기</div></div>`).join("")}</div></section>`;
    }
  } else {
    h = L.map(l => `<section class="sheet door">
      <div class="k">${l.grade}-${l.klass}</div>
      <div class="s">${esc(l.subject)}</div>
      <div class="t">${esc(l.topic || "")}</div>
      <div class="who">${esc(l.teacher)} 선생님 · ${esc(l.place || "")}</div>
      <div class="qr">${qr(link(l.id))}</div>
      <div class="h">QR 코드로 수업 지도안을 보고 참관 피드백을 남겨주세요</div></section>`).join("");
  }
  document.getElementById("out").innerHTML = h;
}
document.getElementById("modes").addEventListener("click", e => {
  const b = e.target.closest("button[data-m]"); if (!b) return;
  mode = b.dataset.m; document.querySelectorAll("#modes button[data-m]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render();
});
document.getElementById("printBtn").onclick = () => window.print();
baseEl.addEventListener("input", render);
render();
</script>
</body>
</html>
